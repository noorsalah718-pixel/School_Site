<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our School - Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
  <div class="nav-inner">
    <input type="checkbox" id="menu-toggle" class="menu-check">
    <a href="index.html" class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><path d="M3 9l9-6 9 6M5 9v9M9 9v9M15 9v9M19 9v9M3 21h18M3 18h18"/></svg>
      Our School
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="activities.html">Activities</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="login.html" class="active">Login</a></li>
    </ul>
    <div class="nav-tools">
      <label for="menu-toggle" class="icon-btn menu-btn" aria-label="Menu">&#9776;</label>
    </div>
  </div>
</nav>

<div class="auth-bg">
  <div class="auth-card">
    <h2>&#128100; Login to Your Account</h2>
    <p class="sub">Enter your details to access your account</p>

    <form action="index.html" method="get">
      <div class="field">
        <label for="username">Email or Username</label>
        <input type="text" id="username" name="username" placeholder="Email or Username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Password" required minlength="6">
      </div>
      <button type="submit" class="btn-block">Login</button>
    </form>

    <p class="foot">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

</body>
</html>
